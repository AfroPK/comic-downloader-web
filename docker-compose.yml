version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comic-downloader-backend
    restart: unless-stopped
    ports:
      - "3000:10000"
    environment:
      - NODE_ENV=production
      - PORT=10000
      - TARGET_SITES=https://batcave.biz,https://xoxocomic.com
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      - /tmp/comic-downloads:/tmp/comic-downloads
    mem_limit: 10g
    cpus: '2'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
